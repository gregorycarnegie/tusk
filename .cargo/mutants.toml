# cargo-mutants configuration.
#
# The host is the default target (.cargo/config.toml), which is what these
# tests need, so there is no triple to name here.

# Mutating test helpers only measures the tests against themselves.
exclude_re = ["tests::"]

exclude_globs = [
    # Only the browser tests reach this, and this config runs the host ones.
    # Measure it on its own, in headless Chrome, with every mutant in tests::
    # left out (September 2026: 21 caught, 3 unviable, 1 timeout):
    #   cargo mutants --no-config --file reader.rs --exclude-re tests:: -j2 \
    #     -- --target wasm32-unknown-unknown
    # The timeout is `sleep` -> (), which spins the polling loop forever.
    "src/reader.rs",
    # DOM glue with no tests of its own.
    "src/app.rs",
    "src/main.rs",
]

# Known equivalent survivors (September 2026, before Hitag2 decoding was removed).
# Left in the run rather than excluded, since line numbers move:
#   frame     mask(.., buf[3..len - 1]) -> len / 1: the extra byte masked is
#             the checksum slot, which the next line overwrites
#   frame     checksum(&buf[..len - 1]) -> len + 1 / len / 1: the extra bytes
#             summed are always still zero
