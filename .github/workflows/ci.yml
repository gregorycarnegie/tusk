name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a PR run, but a deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: verus-0.2026.11.02.8bf68ee
      # Keep this release and verified/Cargo.toml's vstd pin together.
      - name: Install pinned Verus
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/verus.zip" \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.11.02.8bf68ee/verus-0.2026.11.02.8bf68ee-x86-linux.zip
          echo "f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c  $RUNNER_TEMP/verus.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
          echo "$RUNNER_TEMP/verus/verus-x86-linux" >> "$GITHUB_PATH"
      - run: cargo verus verify -p tusk-verified --locked --fwd-verus-args-to roots -- --no-cheating

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # rustfmt leaves view! bodies alone; Topcoat's formatter, at the version
      # of topcoat in Cargo.lock, so its rules move with the library.
      - id: topcoat
        run: |
          version=$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "topcoat") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: topcoat-cli@${{ steps.topcoat.outputs.version }}
      - run: topcoat fmt --check src
      # The host is the default target (.cargo/config.toml), so this lints the
      # host tests, and name wasm32 to lint what actually ships.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test

  # The polling loop in src/reader.rs, against a fake reader in headless Chrome.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-test-runner must match wasm-bindgen in Cargo.lock exactly
      - id: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # The image has Chrome with a matching driver, and geckodriver, which the
      # runner would pick first from PATH. The fake reader needs no WebHID, but
      # Chrome is what the app targets.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo w

  build:
    needs: [verify, check, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - id: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: cargo run --locked -- dist
      - run: cargo build --locked --release --lib --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --no-typescript --out-dir dist target/wasm32-unknown-unknown/release/tusk.wasm
      # Relative URLs must also work below the repository subpath on Pages.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" python3 tests/static_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
