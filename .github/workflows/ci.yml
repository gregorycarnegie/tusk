name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a PR run, but a deploy is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The host is the default target (.cargo/config.toml), so this lints the
      # host tests, and name wasm32 to lint what actually ships.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test

  # The polling loop in src/reader.rs, against a fake reader in headless Chrome.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-test-runner must match wasm-bindgen in Cargo.lock exactly
      - id: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      # The image has Chrome with a matching driver, and geckodriver, which the
      # runner would pick first from PATH. The fake reader needs no WebHID, but
      # Chrome is what the app targets.
      - run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo w

  build:
    needs: [check, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install Trunk
        run: |
          base=https://github.com/trunk-rs/trunk/releases/download/$TRUNK_VERSION
          file=trunk-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "$base/$file" -O "$base/$file.sha256"
          # the .sha256 file holds only the hash, so pair it with the name
          echo "$(cat "$file.sha256")  $file" | sha256sum -c
          tar -xzf "$file" -C ~/.cargo/bin
      # Pages serves the site from /<repo>/, not the domain root.
      - run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
