<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tusk</title>
  <meta name="description" content="Read Paxton Net2 tokens in the browser from a USB desktop reader, over WebHID." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2356AA1C'/%3E%3Cpath d='M9 6c-1 12 5 19 17 20-8-3-12-10-12-20a2.5 2.5 0 0 0-5 0Z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" />
  <script>
    // a saved theme choice, applied before first paint so there is no flash
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link data-trunk rel="rust" />
  <style>
    /* Colours after Paxton's site: leaf green, charcoal, warm off-white.
       Their green (--brand) is too light for text or button fills, so those
       use a deeper green that keeps 4.5:1 contrast. */
    :root {
      color-scheme: light;
      --bg: #F4F3EF;
      --surface: #FFFFFF;
      --sunken: #F7F6F2;
      --text: #3C3C3B;
      --muted: #6B6B69;
      --border: #E3E1DA;
      --brand: #56AA1C;
      --accent: #3F7F14;
      --accent-hover: #356C10;
      --on-accent: #FFFFFF;
      --busy: #B7791F;
      --problem: #C0392B;
      --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 12px 32px rgb(0 0 0 / .06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121411; --surface: #1B1E1A; --sunken: #161815; --text: #ECEDE9;
        --muted: #9A9E96; --border: #2C3029; --brand: #6CC231; --accent: #6CC231;
        --accent-hover: #7ED344; --on-accent: #0E1A06; --busy: #F0B429;
        --problem: #F87171; --shadow: 0 1px 2px rgb(0 0 0 / .3);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121411; --surface: #1B1E1A; --sunken: #161815; --text: #ECEDE9;
      --muted: #9A9E96; --border: #2C3029; --brand: #6CC231; --accent: #6CC231;
      --accent-hover: #7ED344; --on-accent: #0E1A06; --busy: #F0B429;
      --problem: #F87171; --shadow: 0 1px 2px rgb(0 0 0 / .3);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 16px;
    }
    header.top, main, footer { width: 100%; max-width: 40rem; }
    svg { width: 1.25rem; height: 1.25rem; flex: none; }

    header.top { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 0; }
    .brand { display: flex; align-items: center; gap: .6rem; font-size: 1.35rem; font-weight: 700; }
    .brand .logo { width: 2rem; height: 2rem; }
    nav { display: flex; gap: .25rem; }
    .icon-button {
      display: grid; place-items: center; width: 2.5rem; height: 2.5rem; padding: 0;
      border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer;
    }
    .icon-button:hover { background: var(--surface); color: var(--text); }
    .sun { display: none; }
    :root[data-theme="dark"] .sun { display: inline; }
    :root[data-theme="dark"] .moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .sun { display: inline; }
      :root:not([data-theme="light"]) .moon { display: none; }
    }

    .intro { padding: 1.5rem 0 1.75rem; }
    .intro h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.15; font-weight: 700; margin: 0 0 .5rem; }
    .intro p { margin: 0; color: var(--muted); font-size: 1.1rem; max-width: 34rem; }

    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .panel-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .75rem 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
    }
    .status { display: flex; align-items: center; gap: .55rem; margin: 0; font-weight: 600; min-width: 0; }
    .dot { width: .6rem; height: .6rem; border-radius: 50%; flex: none; background: var(--muted); }
    .status[data-tone="ready"] .dot { background: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
    .status[data-tone="busy"] .dot { background: var(--busy); animation: pulse 1s ease-in-out infinite alternate; }
    .status[data-tone="problem"] .dot { background: var(--problem); }
    @keyframes pulse { to { opacity: .3; } }

    button.primary, button.secondary {
      display: inline-flex; align-items: center; gap: .45rem; font: inherit; font-weight: 600;
      border-radius: 999px; cursor: pointer; transition: background .15s ease, border-color .15s ease;
    }
    button.primary { padding: .55rem 1.3rem; border: 0; background: var(--accent); color: var(--on-accent); }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary { padding: .45rem 1rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    button.secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button.secondary:disabled { opacity: .45; cursor: default; }
    button.secondary svg { width: 1.05rem; height: 1.05rem; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .reading { padding: 2rem 1.25rem 1.5rem; text-align: center; background: var(--sunken); }
    .label { margin: 0; font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .number {
      margin: .25rem 0 .5rem; font-size: clamp(3rem, 14vw, 5rem); line-height: 1.1; font-weight: 700;
      font-variant-numeric: tabular-nums; letter-spacing: .03em; color: var(--accent);
      overflow-wrap: anywhere;
    }
    .reading.empty .number { color: var(--border); }
    .meta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: .5rem; margin: 0; min-height: 1.75rem; color: var(--muted); }
    .chip {
      padding: .1rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600;
      background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--accent);
    }
    .chip.beta { background: color-mix(in srgb, var(--busy) 18%, transparent); color: var(--text); }
    code { font: .95rem/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; color: var(--text); overflow-wrap: anywhere; }
    .beta-note { display: none; margin: .75rem auto 0; max-width: 28rem; font-size: .9rem; color: var(--muted); }
    .beta-note.shown { display: block; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 1.25rem; }

    footer { padding: 2rem 0; text-align: center; font-size: .9rem; color: var(--muted); }
    footer a { color: var(--accent); font-weight: 600; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body></body>
</html>
