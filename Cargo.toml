[package]
name = "tusk"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read Paxton Net2 tokens in the browser over WebHID"
repository = "https://github.com/gregorycarnegie/tusk"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidCollectionInfo",
    "HidConnectionEvent",
    "HidDeviceRequestOptions",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
    "HidInputReportEvent",
    "Navigator",
    "Window",
] }

[dev-dependencies]
# round-trip property testing for the frame codec
proptest = "1"
