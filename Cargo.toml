[package]
name = "tusk"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "Read Paxton Net2 tokens in the browser over WebHID"
repository = "https://github.com/gregorycarnegie/tusk"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "MediaQueryList",
    "Storage",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidCollectionInfo",
    "HidConnectionEvent",
    "HidDeviceRequestOptions",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
    "HidInputReportEvent",
    "Navigator",
    "Window",
] }

# Host tests: `cargo t`. proptest does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# round-trip property testing for the frame codec
proptest = "1"

# Browser tests: plain `cargo test`, run in headless Chrome by
# wasm-bindgen-test-runner (.cargo/config.toml), against a fake reader.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
