[package]
name = "tusk"
version = "0.2.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Read Paxton Net2 tokens in the browser over WebHID"
repository = "https://github.com/gregorycarnegie/tusk"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tusk-site"
path = "src/main.rs"

[dependencies]
csv = "1.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
topcoat = { version = "0.8.1", default-features = false, features = ["view"] }
futures-executor = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "BeforeUnloadEvent",
    "MediaQueryList",
    "Storage",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidCollectionInfo",
    "HidConnectionEvent",
    "HidDeviceRequestOptions",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
    "HidInputReportEvent",
    "Navigator",
    "Window",
    "Location",
] }

# Host tests: `cargo test`. proptest does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# round-trip property testing for the frame codec
proptest = "1"

# Browser tests: `cargo w`, run in headless Chrome by
# wasm-bindgen-test-runner (.cargo/config.toml), against a fake reader.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
