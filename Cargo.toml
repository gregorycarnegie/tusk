[package]
name = "tusk"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Read Paxton Net2 tokens in the browser over WebHID, and send cards and portraits to Net2"
repository = "https://github.com/gregorycarnegie/tusk"

[workspace]
members = ["verified"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tusk-site"
path = "src/main.rs"

[dependencies]
tusk-verified = { path = "verified" }
csv = "1.4.0"
# Excel and OpenDocument sheets, read in the browser.
calamine = "0.38.0"
# Net2 Local API JSON, and portrait dimensions checked before upload.
serde_json = "1.0.154"
imagesize = "0.15.0"
sea-query = { version = "1.0.2", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
topcoat = { version = "0.12.1", default-features = false, features = ["view"] }
futures-executor = "0.3.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = [
    "Clipboard",
    "console",
    "Document",
    "Element",
    "HtmlCollection",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "BeforeUnloadEvent",
    "MediaQueryList",
    "Storage",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidCollectionInfo",
    "HidConnectionEvent",
    "HidDeviceRequestOptions",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
    "HidInputReportEvent",
    "Navigator",
    "Window",
    "Location",
    "AbortSignal",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageBitmap",
    "FileReader",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
] }

# Host tests: `cargo test`. proptest does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rstest = { version = "0.29.0", default-features = false }
# round-trip property testing for the frame codec
proptest = "1.12.0"
# builds the xlsx the sheet tests read
zip = { version = "9.8.2", default-features = false }
googletest = "0.14.4"

# Browser tests: `cargo w`, run in headless Chrome by
# wasm-bindgen-test-runner (.cargo/config.toml), against a fake reader.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
