[package]
name = "tusk"
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Read Paxton Net2 tokens in the browser over WebHID, and send cards and portraits to Net2"
repository = "https://github.com/gregorycarnegie/tusk"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tusk-site"
path = "src/main.rs"

[dependencies]
csv = "1.4.0"
# Net2 Local API JSON, and portrait dimensions checked before upload.
serde_json = "1.0.151"
imagesize = "0.15.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
topcoat = { version = "0.8.1", default-features = false, features = ["view"] }
futures-executor = "0.3.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "File",
    "FileList",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "BeforeUnloadEvent",
    "MediaQueryList",
    "Storage",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidCollectionInfo",
    "HidConnectionEvent",
    "HidDeviceRequestOptions",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
    "HidInputReportEvent",
    "Navigator",
    "Window",
    "Location",
    "AbortSignal",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageBitmap",
    "FileReader",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
] }

# Host tests: `cargo test`. proptest does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# round-trip property testing for the frame codec
proptest = "1.11.0"

# Browser tests: `cargo w`, run in headless Chrome by
# wasm-bindgen-test-runner (.cargo/config.toml), against a fake reader.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.78"
